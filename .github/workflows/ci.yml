name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace @segmentpay/shared run build
      - run: npm --workspace @segmentpay/api run typecheck
      - run: npm --workspace @segmentpay/web run typecheck
      - run: npm --workspace @segmentpay/api run test
      - run: npm run build
